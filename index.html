<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta>
    <title>Universe</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js"></script>
    <style>
        body {
            background: black;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
            flex-direction: column;
        }

        .Universe {
            display: flex;
            text-align: center;
            align-items: center;
            justify-content: center;
            font-size: 50px;
        }
        
        .human {
            font-size: 30px;
        }

        .tesla {
            width: 200px;
            height: 200px;
            background: red;
            animation: rain 1s infinite;
            font-size: 20px;
            display: flex;
            text-align: center;
            align-items: center;
            justify-content: center;
            border-radius: 10%;
            border: 2px solid white;
        }

        .spacex {
            background: black;
            width: 200px;
            height: 200px;
            font-size: 20px;
            display: flex;
            text-align: center;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            border: 2px solid white;
        }

        /* @keyframes rain {
            0% {
                transform: translateY(-100px);
            }
            100% {
                transform: translateY(100px);
            }
        } */

        

    </style>
</head>
<body>

    <div class="Universe">
        <h1>
            Universe
        </h1>
    </div>

    <div class="human">
        <p>
            Human Consciousness. We all do for Humanity to become Multi-planetary.
        </p>
    </div>

    <div class="spacex" onclick="location.href='spacex.html'">
        <h1>
            SpaceX
        </h1>
    </div>

    <br>

    <div class="tesla" onclick="location.href='tesla.html'">
        <h1>
            Tesla
        </h1>
    </div>
    
</body>
</html>
